  html, body { margin: 0; padding: 0; background: #e8e8e8; }

  .panel-stage { position: relative; overflow: hidden; }
  .panel-stage svg { transition: opacity .18s ease; }
  .panel-stage.is-off svg, .panel-stage.is-booting svg, .panel-stage.is-on svg { opacity: 1; }
  .ui-layer { position:absolute; inset:0; z-index:2; pointer-events:none; }

  .light-hit { left:1533px; top:165px; width:90px; height:95px; }
  .start-hit { left:1660px; top:165px; width:105px; height:100px; }
  .mode-hit { width:170px; height:75px; }
  .mode-standard { left:173px; top:150px; width:180px; height:65px; }
  .mode-strong { left:350px; top:150px; width:180px; height:65px; }
  .mode-rapid { left:510px; top:150px; width:170px; height:65px; }
  .mode-sterilize { left:163px; top:245px; width:180px; height:65px; }
  .mode-dry { left:336px; top:245px; width:175px; height:65px; }
  .mode-selfclean { left:510px; top:245px; width:180px; height:65px; }

  @keyframes lockFeedbackBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  @keyframes panelSvgBlink { 0%,49%{opacity:1} 50%,100%{opacity:.35} }
  .is-on .mode-dim { opacity:.30; }
  .mode-dim, .step-dim { display:none; }
  .is-on.sterilize .step-dim.sterilize { opacity:.78; background:linear-gradient(90deg,#000 0 27%,transparent 27% 48%,#000 48% 100%); }

  .boot-message { position:absolute; left:900px; top:22px; color:#34c777; font:600 18px/1 sans-serif; opacity:0; }
